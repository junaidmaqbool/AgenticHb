# ============================================================
# dataset.yaml — dataset location, schema, splitting, preprocessing
# Consumed later by DatasetManager (Phase 3). Phase 1 only validates
# that the top-level `dataset` key is present and well-formed.
# ============================================================

dataset:
  name: EyesDefyanemia                 # set per experiment; never hardcode in source
  version: null
  root: EDA                 # dataset root directory
  images_dir: eyesdefyanemia
  masks_dir: eyesdefyanemia
  metadata_file: EDA/eyesdefyanemia.xlsx

  # Optional: train segmentation on a SEPARATE dataset (its own images +
  # masks). Uncomment and set `root` when your mask-annotated set differs
  # from the Hb dataset above. A patients.csv is optional here.
  # segmentation_source:
  #   root: /path/to/segmentation_dataset
  #   images_dir: images
  #   masks_dir: masks
  splits_dir: splits

  # Tissue capture is per-side; prediction models operate per class
  # (left/right pooled at the dataset layer). See Decision 013.
  tissues: [eye]
  # tissues: [eye, palm, tongue, nail]
  tissue_sides:
    eye: [left, right]
    # palm: [left, right]
    # tongue: [center]
    # nail: [left, right]

  # Optional per-tissue image/mask directories. Each side may live in its own
  # dataset. Two accepted shapes per tissue:
  #   flat   -> {images: <dir>, masks: <dir>}            (single, unsided source)
  #   sided  -> {sides: {left: {images, masks}, right: {images, masks}}}
  # A side with a null/blank `images` is skipped; a tissue with no usable images
  # is skipped entirely. Left blank here => conventional root/images_dir/<tissue>.
  tissue_sources: {}
  # tissue_sources:
  #   eye:
  #     sides:
  #       left:  {images: /data/eyes/left,  masks: /data/eyes/left_masks}
  #       right: {images: /data/eyes/right, masks: /data/eyes/right_masks}
  #   tongue: {images: /data/tongue}

  # How to pool the sides of a tissue against a patient's single Hb label:
  #   extended -> every image is an independent data point (more samples; agentic)
  #   single   -> one representative image per (patient, tissue)
  sampling_mode: extended
  tissue_sampling_mode: {}
  # tissue_sampling_mode:
  #   tongue: single

  image:
    channels: 3
    resolution: [224, 224]   # never hardcode in source — read from here
    formats: [jpg, jpeg, png, tiff, bmp]

  metadata:
    patient_id_column: Number
    target_column: Hgb
    mandatory_columns: [Number, Hgb, Age, Gender]
    optional_columns: [Height, Weight, BMI, SES, SpO2, Ethnicity]
    # Columns a client wants carried through the pipeline (informational).
    needed_columns: [Number, Hgb, Age, Gender, Height, Weight, BMI]
    # BMI is derived algorithmically from height/weight when missing/blank.
    height_column: Height
    weight_column: Weight
    bmi_column: BMI
    height_unit: cm          # cm | m — unit of the Height column
    compute_bmi: true

  split:
    strategy: patient_level  # patient_level | kfold | external
    train: 0.80
    validation: 0.10
    test: 0.10
    seed: 42

  preprocessing:
    normalize: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

    # Agentic preprocessing (consumed by PreprocessingAgent; prediction only).
    # Clinical Hb-range gating removes label outliers and focuses the model on a
    # meaningful window. Balanced bin oversampling breaks the "predict the mean"
    # plateau by drawing under-represented (severely anaemic / borderline)
    # samples as often as the dense centre of the distribution.
    hb_filter:
      enabled: true
      min: 6.0               # g/dL — inclusive lower bound
      max: 14.0              # g/dL — inclusive upper bound
    balanced_sampling:
      enabled: true          # train split only; validation stays unweighted
      bins: 10               # number of equal-width Hb bins

  augmentation:
    enabled: true             # applied to training split only
    horizontal_flip: 0.5
    rotation: 15
    brightness_contrast: 0.2
