# ============================================================
# evaluation.yaml — evaluation + reporting configuration
# Consumed later by EvaluationManager (Phase 8).
# ============================================================

evaluation:
  regression_metrics: [mae, rmse, r2, pearson, spearman]
  classification_metrics: [accuracy, precision, recall, f1]
  calibration_metrics: [calibration_error]
  clinical:
    bland_altman: true
    within_thresholds: [0.5, 1.0]   # g/dL agreement bands
  efficiency_metrics: [inference_time, gpu_memory, tissues_used]

  outputs:
    csv: true
    excel: true
    tensorboard: true
    figures: true
    figure_formats: [png, pdf]

  compare_against_baseline: true      # adaptive vs static pipeline

  # Paired significance testing of the baseline-vs-adaptive comparison
  # (Decision 031): paired t-test, Wilcoxon signed-rank, bootstrap CI, Cohen's d.
  significance:
    enabled: true
    bootstrap_iterations: 5000
    confidence_level: 0.95
