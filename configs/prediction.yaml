# ============================================================
# prediction.yaml — hemoglobin prediction subsystem configuration
# Consumed later by PredictionManager (Phase 6). Independent models
# are trained per tissue class (Decision 004).
# ============================================================

prediction:
  available_models: [efficientnet, resnet, densenet, vit, convnext]
  default_model: efficientnet

  # Optional per-tissue default routing (overridable by the routing agent).
  tissue_models:
    eye: vit
    palm: efficientnet
    tongue: convnext
    nail: resnet

  training:
    # Transfer learning: start from ImageNet weights. Random init collapses to
    # predicting the label mean on small clinical datasets.
    pretrained: true
    loss: smoothl1          # robust to Hb-label outliers vs. plain mse
    optimizer: adamw
    learning_rate: 0.0001   # fine-tuning a pretrained backbone; lower than scratch
    batch_size: 16
    epochs: 40              # pretrained + balanced sampling converge fast
    scheduler: cosine
    weight_decay: 0.01
    early_stopping:
      enabled: true
      patience: 10

  input:
    resolution: [224, 224]
    normalize: true

  metadata_fusion:
    enabled: false            # image-only by default; enable to fuse metadata
    features: [Age, Gender, BMI]
