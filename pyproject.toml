# ============================================================
# pyproject.toml — AdaptiveHb
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptivehb"
version = "0.2.0"
description = "Adaptive Multi-Agent Framework for Non-Invasive Hemoglobin Estimation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Junaid" }]
keywords = ["biomedical", "hemoglobin", "deep-learning", "adaptive", "segmentation"]

# Runtime dependencies only. The heavy ML stack is intentionally
# excluded from install_requires so Phase 1 infrastructure remains
# importable and testable without a GPU/torch installation.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "opencv-python>=4.9",
    "albumentations>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "torchmetrics>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
]

[project.scripts]
adaptivehb = "adaptivehb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
